
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Page Information -->
    <title>Solitaire | Fred Wahab Games</title>

    <meta
      name="description"
      content="Play free Klondike Solitaire in your browser. Enjoy classic card gameplay, drag-and-drop moves, smooth animations, undo, and mobile-friendly controls. Built by Fred Wahab."
    />

    <meta name="author" content="Fred Wahab" />
    <meta name="robots" content="index, follow" />

    <!-- Browser Appearance -->
    <meta name="theme-color" content="#146b42" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://fredwahab.github.io/Solitaire/"
    />

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Solitaire" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fred Wahab Games" />
    <meta property="og:title" content="Solitaire | Fred Wahab Games" />

    <meta
      property="og:description"
      content="Play classic Klondike Solitaire online with smooth card movement, drag-and-drop controls, and mobile-friendly gameplay."
    />

    <meta
      property="og:url"
      content="https://fredwahab.github.io/Solitaire/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Solitaire | Fred Wahab Games" />

    <meta
      name="twitter:description"
      content="Enjoy free classic Solitaire in your browser, on desktop or mobile."
    />
  </head>

</html>
